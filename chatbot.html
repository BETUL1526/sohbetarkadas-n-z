<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duygu Tespiti Chatbot</title>
    <link rel="stylesheet" href="chatbot.css"> <!-- CSS dosyasını buraya ekliyoruz -->
</head>

<body>

    <div id="chatbot-container">
        <div id="message-container" class="messages">
            <!-- Mesajlar burada görünecek -->
        </div>
        <div id="input-container" class="input-area">
            <input type="text" id="user-input" placeholder="Mesajınızı yazın...">
            <button id="send-button" onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script src="chatbot.js"></script> <!-- JavaScript dosyasını buraya ekliyoruz -->
</body>

</html>
